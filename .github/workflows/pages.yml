name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Portao de publicacao. Confere as duas direcoes: que documento valido
      # nao gera apontamento inventado, e que documento com defeito conhecido
      # continua sendo apontado. So a primeira metade deixaria passar um motor
      # que aprovasse tudo.
      - name: Conferir o motor contra os exemplos
        run: node tools/verifica.js

      # Carimbo de versao, exibido no rodape. A versao publica ja chega
      # carimbada por tools/monta_publico.py com o commit interno de origem;
      # aqui so se carimba quando o arquivo nao existe. Assim os dois sites
      # mostram o mesmo codigo quando estao iguais.
      - name: Carimbar a versao
        run: |
          if [ ! -f data/versao.js ]; then
            printf 'window.__VERSAO__ = {"commit":"%s","data":"%s"};\n' \
              "$GITHUB_SHA" "$(git log -1 --format=%cI)" > data/versao.js
          fi

      - uses: actions/configure-pages@v5
        # habilita o Pages no proprio fluxo. Sem isto, o primeiro deploy de um
        # repositorio novo falha com "Get Pages site failed" e exige alguem
        # ligar a opcao a mao em Settings antes de rodar de novo.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
